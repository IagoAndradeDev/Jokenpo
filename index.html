<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Jokenpô</title>
</head>
<body>
    <main class="container">
            <div class="titulo">
                <h1>Jokenpô</h1>
                <p>Jogue contra seu computador!</p>
            </div>
            <div class="escolhas">
                <div class="pedra">
                    <button onclick="Jokenpo('Pedra')">&#x1F44A;</button>
                </div>
                <div class="papel">
                    <button onclick="Jokenpo('Papel')">&#x1f590;</button>
                </div>
                <div class="tesoura">
                    <button onclick="Jokenpo('Tesoura')">&#x270c;</button>
                </div>
            </div>
            <div class="resultado">
                <h2>Resultado</h2>
                <p></p>
                <div class="contador">
                    <span class="vitoria">Vitorias:<strong>0</strong></span>
                    <span class="derrota">Derrotas:<strong>0</strong></span>
                </div>
            </div>
    </main>
<script src="script.js"></script>
</body>
</html>
